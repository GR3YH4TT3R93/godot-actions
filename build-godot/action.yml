name: 'Build Godot'
description: 'Build Godot applications for Windows, macOS, and Linux'

inputs:
  build-dir:
    description: 'The chosen build directory'
    required: true
    default: './build'
  godot-executable:
    description: 'The path to the Godot executable'
    required: false
    default: ~/.local/share/bin/godot

runs:
  using: composite
  steps:
    - name: Open Godot editor for reimport
      shell: bash
      run: ${{ inputs.godot-executable }} --import --headless --verbose

    - name: Build Windows application
      shell: bash
      run: |
        mkdir -v -p ${{ inputs.build-dir }}/windows
        ${{ inputs.godot-executable }} --display-driver headless --export-release "Windows Desktop" "${{ inputs.build-dir }}/windows/game.exe" 

    - uses: https://data.forgejo.org/forgejo/upload-artifact@v5
      with:
        name: windows
        path: ${{ inputs.build-dir }}/windows/

    - name: Build Linux application
      shell: bash
      run: |
        mkdir -v -p ${{ inputs.build-dir }}/linux
        ${{ inputs.godot-executable }} --display-driver headless --export-release "Linux" "${{ inputs.build-dir }}/linux/game.x86_64" 

    - uses: https://data.forgejo.org/forgejo/upload-artifact@v5
      with:
        name: linux
        path: ${{ inputs.build-dir }}/linux/
