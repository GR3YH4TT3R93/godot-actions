name: 'Install Godot'
description: 'Installs the Godot engine for macOS'

inputs:
  godot-version:
    description: 'The version of Godot to build with'
    required: true
    default: 0.0
  install-templates:
    description: 'Whether or not to install the Godot export templates'
    required: false
    default: false

outputs:
  godot-executable:
    description: 'The installed executable location'
    value: ${{ steps.assign-executable.outputs.GODOT_EXECUTABLE }}

runs:
  using: composite
  steps:
    - name: Restore Godot from Cache
      uses: actions/cache/restore@v5
      id: godot-cache
      with:
        key: godot-${{inputs.godot-version}}
        path: ~/.local/share/bin/godot
    - name: Install Godot
      if: steps.godot-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo {{ inputs.godot-version }}
        curl -L -o ./godot.zip "https://github.com/godotengine/godot-builds/releases/download/${{ inputs.godot-version }}/Godot_v${{ inputs.godot-version }}_linux.x86_64.zip"
        unzip ./godot.zip
        mkdir -v -p ~/.config/
        mkdir -v -p ~/.local/share/bin
        mv "./Godot_v${{ inputs.godot-version }}_linux.x86_64" ~/.local/share/bin/godot
    - name: Save Godot to Cache
      uses: actions/cache/save@v5
      if: steps.godot-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.local/share/bin/godot
        key: godot-${{inputs.godot-version}}

      
    - name: Restore Install Templates from Cache
      if: ${{ inputs.install-templates }}
      uses: actions/cache/restore@v5
      id: resource-cache
      with:
        key: godot-resource-${{inputs.godot-version}}
        path: ~/.local/share/godot/export_templates
    - name: Install Godot templates
      if: ${{ inputs.install-templates && steps.resource-cache.outputs.cache-hit != 'true'}}
      shell: bash
      env:
        GODOT_TEMPLATES_DIR: ~/.local/share/godot/export_templates

      run: |
        curl -L -o ./godot-templates.zip "https://github.com/godotengine/godot-builds/releases/download/${{ inputs.godot-version }}/Godot_v${{ inputs.godot-version }}_export_templates.tpz"
        unzip ./godot-templates.zip
        mkdir -v -p ~/.local/share/godot/export_templates/
        TEMPO=${{ inputs.godot-version }}
        VER="${TEMPO/-/.}"
        mv -v ./templates ~/.local/share/godot/export_templates/$VER
        ls ~/.local/share/godot/export_templates/$VER
    - name: Save Resources to Cache
      uses: actions/cache/save@v5
      if: ${{ inputs.install-templates &&  steps.resource-cache.outputs.cache-hit != 'true'}}
      with:
        path: ~/.local/share/godot/export_templates
        key: godot-resource-${{inputs.godot-version}}

    - name: Report back the executable location
      shell: bash
      env:
        GODOT_EXECUTABLE: ~/.local/share/bin/godot
      run: echo "GODOT_EXECUTABLE=${{ env.GODOT_EXECUTABLE }}" >> $FORGEJO_OUTPUT
      id: assign-executable
